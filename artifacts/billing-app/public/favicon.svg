<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="100%" height="100%">
  <defs>
    <!-- Background Luxury Gold-Amber Gradient -->
    <radialGradient id="bgGrad" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFB326" />
      <stop offset="45%" stop-color="#F58E07" />
      <stop offset="85%" stop-color="#D96500" />
      <stop offset="100%" stop-color="#A73E00" />
    </radialGradient>

    <!-- Outer Golden Ring Glow Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8A3" />
      <stop offset="50%" stop-color="#FFB020" />
      <stop offset="100%" stop-color="#8F3500" />
    </linearGradient>

    <!-- Diamond Facet Glass Shimmer -->
    <linearGradient id="facetGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.25" />
    </linearGradient>

    <!-- Animated Light Sweep Beam -->
    <linearGradient id="shineSweep" x1="0%" y1="0%" x2="100%" y2="0%" gradientTransform="rotate(45)">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0">
        <animate attributeName="offset" values="-0.6; 1.6" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="15%" stop-color="#FFFFFF" stop-opacity="0.85">
        <animate attributeName="offset" values="-0.45; 1.75" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0">
        <animate attributeName="offset" values="-0.3; 1.9" dur="3s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Diamond Clipping Path for the Light Sweep -->
    <clipPath id="diamondClip">
      <polygon points="62,54 118,54 144,80 90,140 36,80" />
    </clipPath>

    <!-- Subtle Drop Shadow Filter for Luxury Depth -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FFFFFF" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- 1. Circular Golden Badge (Matching Uploaded Image) -->
  <circle cx="90" cy="90" r="82" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="4" />

  <!-- Inner Soft Golden Rim -->
  <circle cx="90" cy="90" r="77" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- 2. Diamond Silhouette with Glass Fills & Facets (Clipped to Diamond Shape) -->
  <g filter="url(#softGlow)">
    <!-- Base Semi-transparent Facets -->
    <polygon points="62,54 118,54 144,80 90,140 36,80" fill="url(#facetGlass)" />
    
    <!-- Table & Crown Facets (Top Section) -->
    <polygon points="72,54 108,54 118,80 62,80" fill="#FFFFFF" fill-opacity="0.22" />
    <polygon points="62,54 72,54 62,80 36,80" fill="#FFFFFF" fill-opacity="0.1" />
    <polygon points="108,54 118,54 144,80 118,80" fill="#FFFFFF" fill-opacity="0.28" />

    <!-- Pavilion Facets (Bottom Triangular Sections) -->
    <polygon points="62,80 90,80 90,140" fill="#FFFFFF" fill-opacity="0.16" />
    <polygon points="90,80 118,80 90,140" fill="#FFFFFF" fill-opacity="0.24" />
    <polygon points="36,80 62,80 90,140" fill="#FFFFFF" fill-opacity="0.08" />
    <polygon points="118,80 144,80 90,140" fill="#FFFFFF" fill-opacity="0.18" />

    <!-- 3. Animated Shining Light Ray Moving Across Diamond -->
    <g clip-path="url(#diamondClip)">
      <rect x="0" y="0" width="180" height="180" fill="url(#shineSweep)">
        <animate attributeName="opacity" values="0.7; 1; 0.7" dur="3s" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- 4. Crisp White Facet Lines (Geometric Wireframe Matching Uploaded Icon) -->
    <g stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Outer Diamond Contour -->
      <polygon points="62,54 118,54 144,80 90,140 36,80" />

      <!-- Horizontal Girdle Line -->
      <line x1="36" y1="80" x2="144" y2="80" />

      <!-- Upper Crown Diagonal Lines -->
      <line x1="72" y1="54" x2="62" y2="80" />
      <line x1="108" y1="54" x2="118" y2="80" />

      <!-- Lower Pavilion Converging Lines -->
      <line x1="62" y1="80" x2="90" y2="140" />
      <line x1="90" y1="80" x2="90" y2="140" />
      <line x1="118" y1="80" x2="90" y2="140" />
    </g>
  </g>

  <!-- 5. Shimmering Sparkle Stars ("Shine Like a Diamond") -->
  <!-- Primary Crown Sparkle (Top-Right) -->
  <g transform="translate(118, 52)">
    <path d="M0,-12 Q0,0 12,0 Q0,0 0,12 Q0,0 -12,0 Q0,0 0,-12 Z" fill="#FFFFFF">
      <animateTransform
        attributeName="transform"
        type="rotate"
        values="0; 90; 180; 270; 360"
        dur="4s"
        repeatCount="indefinite"
      />
      <animate
        attributeName="opacity"
        values="0.3; 1; 0.9; 0.2; 0.3"
        dur="2.5s"
        repeatCount="indefinite"
      />
    </path>
    <!-- Core white center glow -->
    <circle cx="0" cy="0" r="3" fill="#FFFFFF">
      <animate attributeName="r" values="2; 3.8; 2" dur="2.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Secondary Pavilion Sparkle (Bottom-Left) -->
  <g transform="translate(48, 86)">
    <path d="M0,-7 Q0,0 7,0 Q0,0 0,7 Q0,0 -7,0 Q0,0 0,-7 Z" fill="#FFFFFF">
      <animateTransform
        attributeName="transform"
        type="rotate"
        values="45; 135; 225; 315; 405"
        dur="3s"
        repeatCount="indefinite"
      />
      <animate
        attributeName="opacity"
        values="0.1; 0.85; 0.1"
        dur="2.8s"
        repeatCount="indefinite"
      />
    </path>
  </g>

  <!-- Tertiary Culet Sparkle (Bottom Point) -->
  <g transform="translate(90, 138)">
    <circle cx="0" cy="0" r="2.5" fill="#FFFFFF">
      <animate attributeName="opacity" values="0.4; 1; 0.4" dur="2s" repeatCount="indefinite" />
      <animate attributeName="r" values="1.8; 3.2; 1.8" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
